# PMAS CI — backend API tests (against a real PostgreSQL service)
# and frontend date-helper tests.
#
# The backend uses PostgreSQL-specific column types (UUID, JSONB), so the
# tests run against a real PostgreSQL instance provided as a GitHub
# Actions service container — never SQLite, never your production DB.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmas
          POSTGRES_PASSWORD: pmas
          POSTGRES_DB: pmas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://pmas:pmas@localhost:5432/pmas_test
      JWT_SECRET: ci-only-secret-never-use-in-production
      CORS_ORIGINS: http://localhost
      PMAS_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        run: pytest backend/tests -v

  frontend:
    name: Frontend date-helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend tests
        run: node patient-app/demo/tests/dates.test.mjs
